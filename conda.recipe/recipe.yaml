context:
  version: "0.1.0"

package:
  name: flare-routegen
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  script:
    - mkdir -p ${{ PREFIX }}/bin
    - mojo build -I src src/main.mojo -o ${{ PREFIX }}/bin/flare-routegen

requirements:
  host:
    - mojo-compiler =1.0.0
  build:
    - mojo-compiler =1.0.0
    - if: linux
      then:
        - gxx >=13
        - sysroot_linux-64 >=2.34
  run:
    - ${{ pin_compatible('mojo-compiler') }}

tests:
  - script:
      - if: unix
        then:
          - flare-routegen --version
          - flare-routegen --help

about:
  homepage: https://github.com/joeressler/flare-routegen
  repository: https://github.com/joeressler/flare-routegen
  license: MIT
  license_file: LICENSE
  summary: Generate Flare route registrations from structured Mojo comment directives.

extra:
  maintainers:
    - flare-routegen contributors
  project_name:
    - flare-routegen
